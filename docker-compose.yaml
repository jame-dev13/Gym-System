services:
  db:
    container_name: db-gym-app
    image: postgres:latest
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_USER=${DATASOURCE_USERNAME}'
      - 'POSTGRES_PASSWORD=${DATASOURCE_PASSWORD}'
    ports:
      - '${PORT_BIND}'
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    container_name: redis-gym-app
    image: redis:7.2
    ports:
      - '${REDIS_PORT_BIND}'
    restart: always
    command:
      ["redis-server", "--requirepass", "${REDIS_PWD}"]
    volumes:
      - redis-data:/data
volumes:
  db_data:
  redis-data: