name: gym-app-dev
services:
  db:
    ports:
      - '5432:5432'
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_USER=${DATASOURCE_USERNAME}'
      - 'POSTGRES_PASSWORD=${DATASOURCE_PASSWORD}'
    volumes:
      - ./docker/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    ports:
      - '6379:6379'
    command: ["redis-server", "--requirepass", "${REDIS_PWD_DEV}"]