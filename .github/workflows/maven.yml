# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Tests

# Ejecuta en push y PR hacia main, pero solo si cambian tests o código
on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/main/**'
      - 'src/test/**'
      - 'pom.xml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/main/**'
      - 'src/test/**'
      - 'pom.xml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar JDK 21 y cache de Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Ejecutar tests
      - name: Run Maven tests
        run: mvn -B test --file pom.xml

      # 4. Subir reportes de tests como artefacto (aunque fallen)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      # 5. (Opcional) Actualizar grafo de dependencias para Dependabot
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
